server.port=8080
spring.application.name=gestion-tareas

# DevTools: sin caché de Thymeleaf en desarrollo (en producción va en true)
spring.thymeleaf.cache=false

# Fechas en formato ISO (yyyy-MM-dd) para formularios y @RequestParam:
# es el formato que envía <input type="date">. Sin esta propiedad, Spring usa
# el formato corto del Locale y el binding del formulario falla.
spring.mvc.format.date=iso

logging.level.com.universidad=DEBUG
