<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarea no encontrada</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <!-- Spring Boot usa templates/error/404.html automáticamente para los 404 de la vista -->

</html>
